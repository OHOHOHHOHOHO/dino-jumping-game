
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Dino 小遊戲</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
    }

    #game {
      width: 600px;
      height: 200px;
      background-color: #eee;
      border: 2px solid #333;
      margin: 50px auto;
      position: relative;
      overflow: hidden;
    }

    #dino {
      width: 40px;
      height: 40px;
      background-color: green;
      position: absolute;
      bottom: 0;
      left: 50px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="dino"></div>
  </div>
</body>
</html>
