
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Dino 小遊戲</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
    }

    #game {
      width: 600px;
      height: 200px;
      background-color: #eee;
      border: 2px solid #333;
      margin: 50px auto;
      position: relative;
      overflow: hidden;
    }

    #dino {
  width: 60px;
  height: 60px;
  background-image: url("dino.jpg");
  background-size: cover;
  position: absolute;
  bottom: 0;
  left: 50px;
}
    #cactus {
  width: 20px;
  height: 40px;
  background-color: red;
  position: absolute;
  bottom: 0;
  right: 0;
}


  </style>
</head>
<body>
  <div id="game">
    <div id="dino"></div>
    <div id="cactus"></div> 
  </div>
  <script>
  const dino = document.getElementById("dino");
  let isJumping = false;

  document.addEventListener("keydown", function(event) {
    if (event.code === "Space" && !isJumping) {
      jump();
    }
  });

  function jump() {
    isJumping = true;
    let position = 0;
    let upInterval = setInterval(function () {
      if (position >= 100) {
        clearInterval(upInterval);
        // 下落
        let downInterval = setInterval(function () {
          if (position <= 0) {
            clearInterval(downInterval);
            isJumping = false;
          } else {
            position -= 5;
            dino.style.bottom = position + "px";
          }
        }, 20);
      } else {
        // 上升
        position += 5;
        dino.style.bottom = position + "px";
      }
    }, 20);
  }
    const cactus = document.getElementById("cactus");

function moveCactus() {
  let cactusPosition = 600;

  const cactusInterval = setInterval(() => {
    if (cactusPosition < -20) {
      cactusPosition = 600 + Math.random() * 200;
    } else {
      cactusPosition -= 5;
      cactus.style.right = (600 - cactusPosition) + "px";
    }
  }, 20);
}

moveCactus(); 

</script>

</body>
</html>
