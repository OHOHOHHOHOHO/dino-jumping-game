
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Dino 小遊戲</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f4;
    }

    #game {
      width: 600px;
      height: 200px;
      background-color: #eee;
      border: 2px solid #333;
      margin: 50px auto;
      position: relative;
      overflow: hidden;
    }

    #dino {
  width: 60px;
  height: 60px;
  background-image: url("dino.jpg");
  background-size: cover;
  position: absolute;
  bottom: 0;
  left: 50px;
}
    #cactus {
  width: 20px;
  height: 40px;
  background-color: red;
  position: absolute;
  bottom: 0;
  right: 0;
}
    #cactus2 {
  width: 20px;
  height: 40px;
  background-color: red;
  position: absolute;
  bottom: 0;
  right: -300px; /* 比第一顆靠後出現 */
}



  </style>
</head>
<body>
  <div id="score" style="text-align:center; font-size: 24px; font-weight: bold;">
  分數：0
</div>

  <div id="game">
    <div id="dino"></div>
    <div id="cactus"></div> 
    <div id="cactus2"></div>

  </div>
  <script>
  const dino = document.getElementById("dino");
let isJumping = false;
let score = 0;
let highScore = 0;
let speed = 5; // ✅ 初始速度


 function handleKeydown(event) {
  if (event.code === "Space" && !isJumping) {
    jump();
  }
}

document.addEventListener("keydown", handleKeydown);


  function jump() {
    isJumping = true;
    let position = 0;
    let upInterval = setInterval(function () {
      if (position >= 100) {
        clearInterval(upInterval);
        // 下落
        let downInterval = setInterval(function () {
          if (position <= 0) {
            clearInterval(downInterval);
            isJumping = false;
          } else {
            position -= 5;
            dino.style.bottom = position + "px";
          }
        }, 20);
      } else {
        // 上升
        position += 5;
        dino.style.bottom = position + "px";
      }
    }, 20);
  }
    const cactus = document.getElementById("cactus");
    const cactus2 = document.getElementById("cactus2");


function moveCactus() {
  let cactusPosition = 600;

  const cactusInterval = setInterval(() => {
    if (cactusPosition < -20) {
  cactusPosition = 600 + Math.random() * 200;

  // ✅ 加分 + 加速
  score++;
  document.getElementById("score").innerText = "分數：" + score;
  speed += 0.2; // 越來越快
}
else {
      cactusPosition -= speed;
      cactus.style.right = (600 - cactusPosition) + "px";
    }

    // 📦 撞擊偵測
    const dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
    if (cactusPosition > 50 && cactusPosition < 110 && dinoTop < 40) {
  clearInterval(cactusInterval); // 停止 cactus
  document.removeEventListener("keydown", handleKeydown); // 停止跳躍

  // ✅ 更新最高分
  if (score > highScore) {
    highScore = score;
  }

  // ✅ 顯示 Game Over + 分數
  document.getElementById("gameOver").innerHTML =
    `Game Over 🪦<br>得分：${score}<br>最高分：${highScore}`;
  document.getElementById("gameOver").style.display = "block";
}


  }, 20);
}
    function moveCactus2() {
  let cactus2Position = 900;

  const cactus2Interval = setInterval(() => {
    if (cactus2Position < -20) {
      cactus2Position = 600 + Math.random() * 200;
      score++;
      document.getElementById("score").innerText = "分數：" + score;
      speed += 0.2;
    } else {
      cactus2Position -= speed;
      cactus2.style.right = (600 - cactus2Position) + "px";
    }

    // 碰撞偵測
    const dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
    if (cactus2Position > 50 && cactus2Position < 110 && dinoTop < 40) {
      clearInterval(cactus2Interval);
      document.removeEventListener("keydown", handleKeydown);

      if (score > highScore) {
        highScore = score;
      }

      document.getElementById("gameOver").innerHTML =
        `Game Over 🪦<br>得分：${score}<br>最高分：${highScore}`;
      document.getElementById("gameOver").style.display = "block";
    }

  }, 20);
}



moveCactus(); 
    moveCactus2();


</script>
<div id="gameOver" style="display: none; text-align: center; font-size: 32px; color: red; font-weight: bold;">
  Game Over 🪦
</div>

</body>
</html>
